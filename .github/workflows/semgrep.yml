name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '44 9 * * 3'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install Semgrep Community Edition
        run: python -m pip install --disable-pip-version-check --no-cache-dir 'semgrep==1.144.0'

      - name: Run token-free Semgrep scan
        run: >-
          semgrep scan
          --config p/default
          --config p/ci
          --sarif
          --output semgrep.sarif
          --error
          scripts tests .github

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep-community-edition

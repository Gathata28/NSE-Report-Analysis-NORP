name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: python -m pip install --upgrade build

      - name: Build wheel and source distribution
        run: python -m build --outdir /tmp/norp-dist

      - name: Stage database and index release assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/bundle_outputs.py \
            --version "${RELEASE_TAG#v}" \
            --output-dir /tmp/norp-release
          cp /tmp/norp-dist/* /tmp/norp-release/
          cp docs/release_notes_template.md /tmp/release-notes.md
          sed -i "s/{{VERSION}}/${RELEASE_TAG#v}/g; s/{{TAG}}/${RELEASE_TAG}/g; s/{{COMMIT}}/${GITHUB_SHA}/g" /tmp/release-notes.md

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            /tmp/norp-release/* \
            --title "NORP ${{ github.ref_name }}" \
            --notes-file /tmp/release-notes.md

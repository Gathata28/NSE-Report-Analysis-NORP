[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norp-nse-report-analysis"
version = "0.3.0"
description = "Source-verifiable Nairobi Securities Exchange report and market-data archive tools"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "NORP contributors" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/Gathata28/NSE-Report-Analysis-NORP"
Repository = "https://github.com/Gathata28/NSE-Report-Analysis-NORP"
Issues = "https://github.com/Gathata28/NSE-Report-Analysis-NORP/issues"

[project.scripts]
norp-download-reports = "download_reports:main"
norp-import = "norp_import:main"
norp-extract-pdfs = "ocr_local_pdfs:main"
norp-bundle-report = "generate_bundle_report:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "build>=1.2", "twine>=5.0"]

[tool.setuptools]
package-dir = {"" = "scripts"}
py-modules = ["download_reports", "norp_engine", "norp_import", "ocr_local_pdfs", "generate_bundle_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

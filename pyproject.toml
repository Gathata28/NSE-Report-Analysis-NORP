[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "norp-nse-report-analysis"
version = "0.1.0"
description = "Source-verifiable Nairobi Securities Exchange report and market-data archive tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "pdfplumber>=0.11",
  "pypdf>=4.0",
  "pytesseract>=0.3.10",
  "Pillow>=10.0",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
